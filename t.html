<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32 灵枢遥控 - 樱花</title>
    <style>
        :root {
            --paper-bg: #f8f4ed; /* 宣纸色 */
            --ink-black: #2b2b2b; /* 墨黑 */
            --sakura-pink: #fbc2eb; /* 樱粉 */
            --wood-brown: #5d5146; /* 檀木棕 */
        }

        body {
            font-family: "STKaiti", "KaiTi", "SimSun", serif;
            background-color: #e9e4d4;
            color: var(--ink-black);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 樱花 Canvas 背景 */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            display: flex;
            width: 90vw;
            max-width: 900px;
            height: 520px;
            background-color: var(--paper-bg);
            border: 2px solid var(--wood-brown);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
        }

        /* 左侧面板 */
        .sidebar {
            flex: 1;
            padding: 40px;
            border-right: 1px solid #d4c8b8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: linear-gradient(to bottom, transparent 95%, rgba(138, 127, 118, 0.05) 5%);
            background-size: 100% 20px;
        }

        /* 右侧面板 */
        .main-control {
            flex: 1.4;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.3);
            position: relative;
        }

        /* 装饰圆窗设计 */
        .main-control::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border: 1px solid rgba(93, 81, 70, 0.2);
            border-radius: 50%;
            z-index: -1;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            letter-spacing: 8px;
            font-weight: normal;
            border-bottom: 2px solid var(--wood-brown);
            display: inline-block;
            padding-bottom: 5px;
        }

        .status-bar {
            padding: 8px;
            font-size: 14px;
            border: 1px dashed var(--wood-brown);
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
        }

        .connected { color: #4a5d23; border-style: solid; background: rgba(74, 93, 35, 0.05); }
        .disconnected { color: #8a7f76; }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: transparent;
            border: 1px solid var(--wood-brown);
            color: var(--ink-black);
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        button:hover {
            background: rgba(93, 81, 70, 0.1);
        }

        button:active {
            background: var(--wood-brown);
            color: white;
            transform: scale(0.95);
        }

        .btn-connect {
            background: #a73222; /* 朱砂红 */
            color: white;
            border: none;
            width: 100%;
            margin-bottom: 25px;
            font-size: 18px;
            box-shadow: 0 4px 0 #7a2519;
        }
        .btn-connect:active {
            box-shadow: 0 0px 0 #7a2519;
            transform: translateY(4px);
        }

        /* 方向控制盘 */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 15px;
        }

        .d-pad button {
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 4px;
        }

        .btn-stop {
            border-radius: 50% !important;
            background: var(--ink-black);
            color: white;
            border: none;
        }

        /* 速度条 */
        .slider-box {
            width: 100%;
            margin-top: 30px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            -webkit-appearance: button;
            -moz-appearance: button;
            appearance: button;
            width: 100%;
            height: 2px;
            background: var(--wood-brown);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #a73222;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid var(--paper-bg);
        }

        .speed-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-top: 12px;
            letter-spacing: 2px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                width: 95vw;
                overflow-y: auto;
            }
            .sidebar { border-right: none; border-bottom: 1px solid #d4c8b8; padding: 25px; }
            .main-control { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <canvas id="sakura-canvas"></canvas>

    <div class="container">
        <!-- 左侧：状态与动作 -->
        <div class="sidebar">
            <div>
                <h1>遥控</h1>
                <div id="status" class="status-bar disconnected">
                    【 未与蓝牙连接 】<br>
                    跳跃状态: <span id="jumpStatus">-</span>
                </div>
                <button class="btn-connect" onclick="connectBLE()">蓝牙连接</button>
                
                <div class="btn-group">
                    <button onclick="sendCommand(0x06, 0)">起立(双腿)</button>
                    <button onclick="sendCommand(0x07, 0)">蹲下(双腿)</button>
                    <button onclick="sendCommand(0x08, 0)">跳跃</button>
                </div>
                <div class="btn-group">
                    <button onclick="sendCommand(0x09, 0)">左抬</button>
                    <button onclick="sendCommand(0x10, 0)">右抬</button>
                    <button onclick="sendCommand(0x11, 0)">左降</button>
                    <button onclick="sendCommand(0x12, 0)">右降</button>
                </div>
            </div>

            <div class="slider-box">
                <input type="range" id="speedSlider" min="0" max="127" value="50" oninput="updateSpeed(this.value)">
                <div class="speed-label">
                    <span>行疾程度</span>
                    <span id="speedVal">50</span>
                </div>
            </div>
        </div>

        <!-- 右侧：方向控制 -->
        <div class="main-control">
            <div class="d-pad">
                <button style="grid-column:2" onmousedown="startForward()" onmouseup="stopMove()" ontouchstart="startForward()" ontouchend="stopMove()">前</button>
                <button style="grid-column:1; grid-row:2" onmousedown="startLeft()" onmouseup="stopTurn()" ontouchstart="startLeft()" ontouchend="stopTurn()">左</button>
                <button class="btn-stop" onclick="sendCommand(0x05, 0)">止</button>
                <button style="grid-column:3; grid-row:2" onmousedown="startRight()" onmouseup="stopTurn()" ontouchstart="startRight()" ontouchend="stopTurn()">右</button>
                <button style="grid-column:2; grid-row:3" onmousedown="startBackward()" onmouseup="stopMove()" ontouchstart="startBackward()" ontouchend="stopMove()">后</button>
            </div>
              <div style="margin-top:20px; font-size:18px; color:#5d4123;">
       <div style="margin-top:20px; font-size:18px; color:#5d4123;">
    跳跃: <span id="jumpStatus" style="font-weight:bold;">-</span><br>
    左腿: <span id="leftLeg">-</span>m | 右腿: <span id="rightLeg">-</span>m
</div>
    </div>
        </div>
        <div class="key-hint" style="margin-top:20px; font-size:12px; color:#666;">
            <p><b>键盘控制：</b></p>
            <p>W/S 前进后退 | A/D 左右 | j 停止</p>
            <p>Q 起立 | E 蹲下 | R 跳跃</p>
            <p>Z/X 左抬/右抬 | C/V 左降/右降</p>
        </div>
    </div>

    <script>
        // --- 樱花飘落逻辑 ---
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        let sakuraList = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Sakura {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 5 + 5;
                this.speedX = Math.random() * 1 + 0.5;
                this.speedY = Math.random() * 1.5 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.angleVel = Math.random() * 0.02;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.angleVel;
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#fbc2eb';
                ctx.fill();
                ctx.restore();
            }
        }

        function animateSakura() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sakuraList.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateSakura);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        for (let i = 0; i < 50; i++) sakuraList.push(new Sakura());
        animateSakura();

        // --- BLE 控制逻辑 ---
        const SERVICE_UUID = 'ba0d1b7e-7ad8-11ef-b864-0242ac120002';
        const RX_UUID = 'c7ebcf24-7ad8-11ef-b864-0242ac120002';
        
        let device = null;
        let rxCharacteristic = null;
        let currentSpeed = 50;

        function updateStatus(text, connected) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status-bar ' + (connected ? 'connected' : 'disconnected');
        }

        async function connectBLE() {
            try {
                updateStatus('【 搜寻蓝牙... 】', false);
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Bot' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                 // 添加这段：接收ESP32发来的数据
                const txUUID = 'd3c5baf8-7ad8-11ef-b864-0242ac120002';
                const txCharacteristic = await service.getCharacteristic(txUUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', function(event) {
                    const value = event.target.value;
                    const data = new Uint8Array(value.buffer);
                    if (data.length >= 3) {
                    document.getElementById('jumpStatus').innerText = data[0];
                    document.getElementById('leftLeg').innerText = (data[1] / 100).toFixed(2);
                    document.getElementById('rightLeg').innerText = (data[2] / 100).toFixed(2);
    }
                });

                updateStatus('【 已契约: ' + device.name + ' 】', true);
                device.addEventListener('gattserverdisconnected', () => updateStatus('【 契约已断 】', false));
            } catch (error) {
                updateStatus('【 失败: ' + error.message + ' 】', false);

            }
            
        }

        async function sendCommand(cmd, value) {
            if (!rxCharacteristic) return;
            const buffer = new ArrayBuffer(7);
            const view = new Uint8Array(buffer);
            view[0] = 0xA5; view[1] = cmd; view[2] = value; view[6] = 0x5A;
            try { await rxCharacteristic.writeValue(buffer); } catch (e) {}
        }

        function updateSpeed(val) {
            currentSpeed = parseInt(val);
            document.getElementById('speedVal').textContent = val;
        }

        function startForward(e) { if(e) e.preventDefault(); sendCommand(0x01, currentSpeed); }
        function startBackward(e) { if(e) e.preventDefault(); sendCommand(0x02, -currentSpeed); }
        function startLeft(e) { if(e) e.preventDefault(); sendCommand(0x03, currentSpeed); }
        function startRight(e) { if(e) e.preventDefault(); sendCommand(0x04, -currentSpeed); }
        function stopMove(e) { if(e) e.preventDefault(); sendCommand(0x05, 0); }
        function stopTurn(e) { if(e) e.preventDefault(); sendCommand(0x05, 0); }
        function startjump(e) { if(e) e.preventDefault(); sendCommand(0x08, 0); }
        function start_single_up(e) { if(e) e.preventDefault(); sendCommand(0x09, 0); }

        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': startForward(); break;
                case 's': startBackward(); break;
                case 'a': startLeft(); break;
                case 'd': startRight(); break;
                case 'q': sendCommand(0x06, 0); break;  // 起立
                case 'e': sendCommand(0x07, 0); break;  // 蹲下
                case 'r': sendCommand(0x08, 0); break;  // 跳跃
                case 'z': sendCommand(0x09, 0); break;  // 左抬
                case 'x': sendCommand(0x10, 0); break;  // 右抬
                case 'c': sendCommand(0x11, 0); break;  // 左降
                case 'v': sendCommand(0x12, 0); break;  // 右降
                case 'j': sendCommand(0x05, 0); break;  // 停止
            }
        });
        document.addEventListener('keyup', (e) => {
            if (['w','s','a','d','q','e','z','x','c','v'].includes(e.key.toLowerCase())) stopMove();
        });
    </script>
</body>
</html>
